<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }

    .contact-container {
      display: flex; flex-wrap: wrap; gap: 30px;
      max-width: 1000px; width: 100%;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px; border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(12px);
    }

    .contact-form, .contact-info {
      flex: 1; min-width: 280px;
    }

    .contact-form h2, .contact-info h2 {
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .contact-form input, 
    .contact-form textarea {
      width: 100%; padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 2px solid transparent;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s;
    }

    .contact-form input:focus, 
    .contact-form textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56,189,248,0.6);
      outline: none;
    }

    .contact-form button {
      width: 100%; padding: 12px;
      border: none; border-radius: 10px;
      background: linear-gradient(45deg,#38bdf8,#0ea5e9);
      color: #fff; font-weight: bold;
      cursor: pointer; transition: 0.3s;
    }
    .contact-form button:hover {
      transform: translateY(-3px) scale(1.05);
      background: linear-gradient(45deg,#0ea5e9,#38bdf8);
    }

    .contact-info p {
      margin-bottom: 15px; color: #cbd5e1;
    }

    .contact-info ul {
      list-style: none; margin-bottom: 20px;
    }

    .contact-info li {
      margin: 10px 0; color: #94a3b8;
    }

    .social-links {
      display: flex; gap: 15px;
    }
    .social-links a img {
      width: 35px; height: 35px;
      border-radius: 50%; transition: 0.3s;
    }
    .social-links a img:hover {
      transform: scale(1.2) rotate(10deg);
      box-shadow: 0 0 12px rgba(56,189,248,0.6);
    }

    #formResult {
      margin-top: 15px; color: #22c55e; font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <!-- Contact Form -->
    <div class="contact-form">
      <h2>Send a Message ✉️</h2>
      <form onsubmit="sendMessage(event)">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <textarea id="message" placeholder="Write your message..." rows="5" required></textarea>
        <button type="submit">🚀 Send</button>
      </form>
      <p id="formResult"></p>
    </div>

    <!-- Contact Info -->
    <div class="contact-info">
      <h2>Let’s Connect</h2>
      <p>If you’d like to collaborate or just say hi, feel free to reach out.</p>
      <ul>
        <li>📧 Email: pm6726576@gmail.com</li>
        <li>📱 Phone: +91-9876543210</li>
        <li>📍 Location: New Delhi, India</li>
        
      </ul>
      <div class="social-links">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="GitHub"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111467.png" alt="LinkedIn"></a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
      </div>
    </div>
  </div>

  <script>
    function sendMessage(event) {
      event.preventDefault();
      document.getElementById("formResult").innerText = "✅ Thanks! Your message has been sent.";
    }
  </script>
</body>
</html>
